name: ZeroLeak CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flask
        run: pip install flask

      - name: Run Python syntax check
        run: python -m py_compile Devops1.py Scanner.py

      - name: Run Scanner Test
        run: |
          python -c "from Scanner import scan_code; print(scan_code(\"api_key='test123'\"))"